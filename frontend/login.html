<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMind — Log In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="login-main">
    <section id="login-section">
      <div class="doc-signature">
        <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
          <rect class="page" x="14" y="6" width="30" height="40" rx="2" transform="rotate(6 28 26)"/>
          <rect class="page front" x="10" y="10" width="34" height="40" rx="2"/>
          <line class="line" x1="17" y1="22" x2="37" y2="22"/>
          <line class="line" x1="17" y1="29" x2="37" y2="29"/>
          <line class="line" x1="17" y1="36" x2="30" y2="36"/>
        </svg>
        <div class="scan-line"></div>
      </div>

      <h1>DocuMind</h1>
      <p>Sign in to summarize and query your documents.</p>

      <input type="text" id="username" placeholder="Username" autocomplete="username" />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn">Log In</button>
      <p id="loginStatus"></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
